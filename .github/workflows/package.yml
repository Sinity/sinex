name: package

# Builds the Nix package of each master commit and publishes its runtime
# closure to sinity.cachix.org, where Sinnix fetches it when it moves its pin
# to that commit; Sinnix never compiles a product. The build is the flake at
# the pushed revision, so it is the same derivation Sinnix evaluates (the
# product keeps its own nixpkgs). Sinnix can pin a revision master does not
# contain, such as a deployment branch's head: build it with
# `gh workflow run package -f rev=<commit>`.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      rev:
        description: Commit to build and publish
        required: true
      verify-vms:
        description: Verify the module and deployed stack, topology and restore VMs
        type: boolean
        default: false

env:
  # Export exclusions must have the same meaning on builders and deployers.
  FLAKE: "git+https://github.com/${{ github.repository }}?rev=${{ inputs.rev || github.sha }}&shallow=1&exportIgnore=1"

concurrency:
  group: package-${{ inputs.rev || github.sha }}

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Free disk space for the build
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc
          sudo nohup rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL >/dev/null 2>&1 &
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: sinity
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - name: Identify the source and package
        run: |
          nix --version
          nix flake metadata --json "$FLAKE"
          nix eval --json "${FLAKE}#default.drvPath"
      - name: Build the package
        run: |
          dependencies=$(nix build --no-link --print-build-logs --print-out-paths "${FLAKE}#sinex-dependencies")
          out=$(nix build --no-link --print-build-logs --print-out-paths "${FLAKE}#default")
          echo "built $out"
          echo "dependencies=$dependencies" >> "$GITHUB_ENV"
          echo "out=$out" >> "$GITHUB_ENV"
      - name: Publish its closure to sinity.cachix.org
        run: cachix push sinity "$out" "$dependencies"
      - name: Verify the deployment module and VMs
        if: ${{ inputs.verify-vms }}
        run: |
          nix build --no-link --print-build-logs \
            "${FLAKE}#checks.x86_64-linux.postgresql-uuid-bounds" \
            "${FLAKE}#checks.x86_64-linux.module" \
            "${FLAKE}#checks.x86_64-linux.vm-stack" \
            "${FLAKE}#checks.x86_64-linux.vm-topology" \
            "${FLAKE}#checks.x86_64-linux.vm-restore"
