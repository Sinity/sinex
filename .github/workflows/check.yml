name: check

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for the test build
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      # The development shell carries PostgreSQL 18 with the patched TimescaleDB
      # and pgvector that the compile-time query checks and database tests need.
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - uses: Swatinem/rust-cache@v2
      - name: cargo xtask check
        run: nix develop --command cargo xtask check
      - name: cargo xtask test
        run: nix develop --command cargo xtask test
