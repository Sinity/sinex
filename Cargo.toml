[workspace]
resolver = "2"
members = [
    "crates/sinex-macros",
    "crates/sinex-model",
    "crates/sinex-protocol",
    "crates/sinex-transport",
    "crates/sinex-schema",
    "crates/sinex-store",
    "crates/sinex-sources",
    "crates/sinex-source-core",
    "crates/sinex-sealing",
    "crates/sinex-derivations",
    "crates/sinex-analysis",
    "crates/sinex-library",
    "crates/sinexd",
    "crates/sinex-session",
    "crates/sinex-capture",
    "crates/sinexctl",
    "crates/sinex-diagnostics",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "signal"] }
uuid = { version = "1", features = ["v7", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
blake3 = "1"
regex = "1"
getrandom = "0.3"
age = { version = "0.11", default-features = false }
chacha20poly1305 = "0.10"
base64 = "0.22"
thiserror = "2"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "json", "macros", "time"] }
rusqlite = { version = "0.32", features = ["bundled"] }
gix = { version = "0.89", default-features = false, features = ["sha1"] }
notify = { version = "8", default-features = false }
clap = { version = "4", features = ["derive"] }
proptest = "1"
# Civil time in the operator's zone (sinex-model::time_settings); the tz database is
# bundled so day boundaries do not depend on the build host.
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
caseless = "0.2"
unicode-normalization = "0.1"
unicode-segmentation = "1"
sea-query = { version = "1", default-features = false, features = ["backend-postgres", "with-json", "with-uuid", "with-time"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
rmcp = { version = "3", features = ["server", "transport-io"] }
schemars = { version = "1", features = ["uuid1"] }
credential-masking = { git = "https://github.com/Sinity/polylogue-sinex-common", tag = "v0.7.6" }
hashed-blobs = { git = "https://github.com/Sinity/polylogue-sinex-common", tag = "v0.7.6" }
devkit = { git = "https://github.com/Sinity/polylogue-sinex-common", tag = "v0.7.6", features = ["pg", "nats"] }
async-nats = "0.47"
# The NATS server checks passwords against bcrypt hashes in its config.
bcrypt = "0.17"
jsonschema = { version = "0.42", default-features = false }
futures = "0.3"
sinex-macros = { path = "crates/sinex-macros" }
sinex-model = { path = "crates/sinex-model" }
sinex-protocol = { path = "crates/sinex-protocol" }
sinex-transport = { path = "crates/sinex-transport" }
sinex-schema = { path = "crates/sinex-schema" }
sinex-store = { path = "crates/sinex-store" }
sinex-sources = { path = "crates/sinex-sources", default-features = false }
sinex-source-core = { path = "crates/sinex-source-core" }
sinex-sealing = { path = "crates/sinex-sealing" }
sinex-derivations = { path = "crates/sinex-derivations" }
sinex-analysis = { path = "crates/sinex-analysis" }
sinex-library = { path = "crates/sinex-library" }
sinex-diagnostics = { path = "crates/sinex-diagnostics" }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
# Skeleton bodies are allowed while the workspace is being filled.
todo = "warn"

# Line tables keep backtraces useful at a fraction of the binary size.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package.blake3]
opt-level = 3

# The library scan hashes every file with SHA-256 and MD5 as well.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.md-5]
opt-level = 3

[profile.dev.package."*"]
debug = false
