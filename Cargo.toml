[workspace]
resolver = "2"
members = [
    "crate/sinex-macros",
    "crate/sinex-model",
    "crate/sinex-protocol",
    "crate/sinex-schema",
    "crate/sinex-store",
    "crate/sinex-sources",
    "crate/sinex-automata",
    "crate/sinex-analysis",
    "crate/sinex-library",
    "crate/sinexd",
    "crate/sinex-session",
    "crate/sinex-capture",
    "crate/sinexctl",
    "crate/sinex-offline",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "signal"] }
uuid = { version = "1", features = ["v7", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
blake3 = "1"
thiserror = "2"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "json", "macros", "time"] }
rusqlite = { version = "0.32", features = ["bundled"] }
gix = { version = "0.89", default-features = false, features = ["sha1"] }
notify = { version = "8", default-features = false }
clap = { version = "4", features = ["derive"] }
proptest = "1"
# Civil time in the operator's zone (sinex-model::civil); the tz database is
# bundled so day boundaries do not depend on the build host.
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
caseless = "0.2"
unicode-normalization = "0.1"
unicode-segmentation = "1"
sea-query = { version = "1", default-features = false, features = ["backend-postgres", "with-json", "with-uuid", "with-time"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
rmcp = { version = "3", features = ["server", "transport-io"] }
schemars = { version = "1", features = ["uuid1"] }
credential-masking = { git = "https://github.com/Sinity/polylogue-sinex-common", tag = "v0.3.0" }
hashed-blobs = { git = "https://github.com/Sinity/polylogue-sinex-common", tag = "v0.3.0" }
devkit = { git = "https://github.com/Sinity/polylogue-sinex-common", tag = "v0.3.0", features = ["pg", "nats"] }
async-nats = "0.47"
jsonschema = { version = "0.42", default-features = false }
futures = "0.3"
sinex-macros = { path = "crate/sinex-macros" }
sinex-model = { path = "crate/sinex-model" }
sinex-protocol = { path = "crate/sinex-protocol" }
sinex-schema = { path = "crate/sinex-schema" }
sinex-store = { path = "crate/sinex-store" }
sinex-sources = { path = "crate/sinex-sources" }
sinex-automata = { path = "crate/sinex-automata" }
sinex-analysis = { path = "crate/sinex-analysis" }
sinex-library = { path = "crate/sinex-library" }
sinex-offline = { path = "crate/sinex-offline" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Skeleton bodies are allowed while the workspace is being filled.
todo = "warn"

# Line tables keep backtraces useful at a fraction of the binary size.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package.blake3]
opt-level = 3
