[workspace]
resolver = "2"
members = ["crate/sinex-model", "crate/sinex-protocol", "crate/sinex-store", "crate/sinexd", "crate/sinexctl", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }

# Line tables keep backtraces useful at a fraction of the binary size; the
# daemon hashes its own executable at startup.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package.blake3]
opt-level = 3
