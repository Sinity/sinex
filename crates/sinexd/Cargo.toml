sinex-schema.workspace = true
sinex-store.workspace = true
sinex-sources = { workspace = true, features = ["full"] }
sinex-library.workspace = true
sinex-derivations.workspace = true
sinex-analysis.workspace = true
sinex-protocol = { workspace = true, features = ["cli"] }
serde_json.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["net"] }
clap.workspace = true
time.workspace = true
uuid.workspace = true
thiserror.workspace = true
async-nats.workspace = true
bcrypt.workspace = true
jsonschema.workspace = true
futures.workspace = true
base64.workspace = true
blake3.workspace = true
serde.workspace = true
jiff.workspace = true
axum.workspace = true
tokio-stream.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
age.workspace = true
