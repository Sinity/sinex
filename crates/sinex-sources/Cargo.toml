[package]
name = "sinex-sources"
description = "Source families and live capture, built over sinex-source-core."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
sinex-source-core.workspace = true
sinex-model.workspace = true
sinex-protocol.workspace = true
thiserror = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
base64.workspace = true
blake3.workspace = true
time.workspace = true
rusqlite = { workspace = true, optional = true }
notify.workspace = true
uuid.workspace = true
gix = { workspace = true, optional = true }
tokio = { workspace = true, features = ["process"] }
async-nats.workspace = true
futures.workspace = true
csv = { version = "1", optional = true }
regex.workspace = true
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"], optional = true }
tempfile = "3"
imbl = "5"
mailparse = { version = "0.16", optional = true }
encoding_rs = { version = "0.8", optional = true }
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
sha2 = { version = "0.10", optional = true }
md-5 = { version = "0.10", optional = true }
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }

[dev-dependencies]
sinex-transport.workspace = true
tar = "0.4"
flate2 = "1"
async-nats.workspace = true
futures.workspace = true
zip = { version = "2", default-features = false, features = ["deflate", "bzip2"] }
allocation-counter = "0.8.1"
proptest.workspace = true
devkit.workspace = true
hashed-blobs.workspace = true

[lints]
workspace = true

[features]
default = ["full"]
full = ["dep:csv", "dep:thiserror","sinex-source-core/archives", "sinex-source-core/sqlite", "dep:rusqlite", "dep:gix", "dep:serde-saphyr", "dep:mailparse", "dep:encoding_rs", "dep:sha2", "dep:md-5", "dep:ureq", "dep:rustls", "dep:webpki-roots"]

[[test]]
name = "golden"
required-features = ["full"]

[[test]]
name = "framing"
required-features = ["full"]

[[test]]
name = "archive"
required-features = ["full"]
