[package]
name = "sinex-sources"
description = "The source framework (parser seam, drain, shared drivers) and every source, one module per family."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
sinex-transport.workspace = true
sinex-model.workspace = true
sinex-protocol.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
base64.workspace = true
blake3.workspace = true
thiserror.workspace = true
time.workspace = true
rusqlite.workspace = true
notify.workspace = true
uuid.workspace = true
gix.workspace = true
tokio.workspace = true
async-nats.workspace = true
futures.workspace = true
zip = { version = "2", default-features = false, features = ["deflate", "bzip2"] }
tar = "0.4"
flate2 = "1"
csv = "1"
regex.workspace = true
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
tempfile = "3"
rustix = { version = "1", features = ["process"] }
imbl = "5"
mailparse = "0.16"
encoding_rs = "0.8"
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
sha2 = "0.10"
md-5 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
allocation-counter = "0.8.1"
proptest.workspace = true
devkit.workspace = true
hashed-blobs.workspace = true

[lints]
workspace = true
