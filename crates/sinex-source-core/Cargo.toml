[package]
name = "sinex-source-core"
description = "The parser, drain and driver framework, with optional archive and SQLite readers."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
sinex-model.workspace = true
sinex-protocol.workspace = true
sinex-transport.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
blake3.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true
tokio.workspace = true
async-nats.workspace = true
futures.workspace = true
base64.workspace = true
jiff.workspace = true
imbl = "5"
csv = "1"
tempfile = "3"
rustix = { version = "1", features = ["process"] }
rusqlite = { workspace = true, optional = true }
zip = { version = "2", default-features = false, features = ["deflate", "bzip2"], optional = true }
tar = { version = "0.4", optional = true }
flate2 = { version = "1", optional = true }

[dev-dependencies]
allocation-counter = "0.8.1"
proptest.workspace = true
devkit.workspace = true
hashed-blobs.workspace = true

[lints]
workspace = true

[features]
archives = ["dep:zip", "dep:tar", "dep:flate2"]
sqlite = ["dep:rusqlite"]
