[package]
name = "sinexd"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["runtime"]
runtime = ["sinex-store/product", "dep:axum", "dep:futures-util"]

[dependencies]
# Temporary qualification binding. Integration replaces this exact owner source with its immutable remote tag.
credential-output = { git = "file:///realm/worktree/polylogue-credential-output-20261015", rev = "0fc160e803018c6c65b36a20630d95f7a18b6efb" }
sinex-model = { path = "../sinex-model" }
sinex-protocol = { path = "../sinex-protocol" }
sinex-store = { path = "../sinex-store", default-features = false }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap = { version = "4", features = ["derive"] }
toml = "0.8"
schemars = "0.8"
fs2 = "0.4"
axum = { version = "0.8", optional = true }
blake3 = "1"

sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
uuid = { version = "1", features = ["v7", "serde"] }
time = { version = "0.3", features = ["formatting"] }

futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }
