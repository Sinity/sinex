[package]
name = "sinexd"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["runtime"]
runtime = ["sinex-store/product", "dep:axum", "dep:futures-util"]

[dependencies]
credential-masking = { git = "https://github.com/Sinity/polylogue-sinex-common", tag = "v0.1.0" }
sinex-model = { path = "../sinex-model" }
sinex-protocol = { path = "../sinex-protocol" }
sinex-store = { path = "../sinex-store", default-features = false }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap = { version = "4", features = ["derive"] }
toml = "0.8"
schemars = "0.8"
fs2 = "0.4"
axum = { version = "0.8", optional = true }
blake3 = "1"

sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
uuid = { version = "1", features = ["v7", "serde"] }
time = { version = "0.3", features = ["formatting"] }

futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }
