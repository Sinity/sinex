[package]
name = "sinex-sources"
description = "The source framework (parser seam, drain, shared drivers) and every source, one module per family."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
sinex-model.workspace = true
sinex-protocol.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
base64.workspace = true
blake3.workspace = true
thiserror.workspace = true
time.workspace = true
rusqlite.workspace = true
notify.workspace = true
uuid.workspace = true
gix.workspace = true
tokio.workspace = true
async-nats.workspace = true
futures.workspace = true
hashed-blobs.workspace = true
zip = { version = "2", default-features = false, features = ["deflate", "bzip2"] }
tar = "0.4"
flate2 = "1"
csv = "1"
mailparse = "0.16"
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
sha2 = "0.10"
md-5 = "0.10"

[dev-dependencies]
proptest.workspace = true
devkit.workspace = true

[lints]
workspace = true
