# Source: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
# Upstream: Gitleaks default rules, reviewed 2026-09-01.
# This is a deliberately small vendored subset. Sinex keeps its own matcher
# and strategy dispatch, while these credential formats come from the
# maintained upstream ruleset rather than being independently invented here.

[[rules]]
id = "mailchimp-api-key"
description = "Mailchimp API key"
regex = '''(?i)\b[0-9a-f]{32}-us\d{1,2}\b'''

[[rules]]
id = "sendgrid-api-token"
description = "SendGrid API token"
regex = '''SG\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}'''

[[rules]]
id = "twilio-api-key"
description = "Twilio API key"
regex = '''SK[0-9a-f]{32}'''
