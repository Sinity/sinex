[package]
name = "sinex-model"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v7"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
blake3 = "1"
caseless = "0.2.2"
unicode-normalization = "0.1"
unicode-segmentation = "1.12"
winnow = "0.7"
