[profile.default]
slow-timeout = { period = "30s", terminate-after = 4 }
fail-fast = false

# The crash harness runs whole stages against the development PostgreSQL,
# whose data lives on a few-GB tmpfs shared with other work; two at a time
# bound the competing stages and replay transactions.
[test-groups]
crash = { max-threads = 2 }

[[profile.default.overrides]]
filter = "binary_id(=sinexd::integration) & test(/^crash::/)"
test-group = "crash"
