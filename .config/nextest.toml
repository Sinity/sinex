[profile.default]
slow-timeout = { period = "30s", terminate-after = 4 }
fail-fast = false

# The crash harness runs whole backfills against the test PostgreSQL, whose
# data lives on a few-GB tmpfs shared with every other database test; two at a
# time bound the space the competing backfills and replay transactions take,
# while the rest of the suite keeps running beside them.
[test-groups]
crash = { max-threads = 2 }

[[profile.default.overrides]]
filter = "binary_id(=sinexd::integration) & test(/^crash::/)"
test-group = "crash"
