[profile.default]
slow-timeout = { period = "30s", terminate-after = 4 }
fail-fast = false

# The crash harness runs whole backfills against the development PostgreSQL,
# whose data lives on a tmpfs shared with other work; the group bounds how
# many competing backfills and replay transactions run at once while the rest
# of the suite keeps running beside them.
[test-groups]
crash = { max-threads = 4 }

[[profile.default.overrides]]
filter = "binary_id(=sinexd::integration) & test(/^crash::/)"
test-group = "crash"
