schema = 1

[project]
id = "sinex"
display_name = "Sinex"
root_markers = ["Cargo.toml", "flake.nix", "xtask"]

[environment]
kind = "nix-develop"
command = ["nix", "develop", "--accept-flake-config", "--command"]
inherit = ["HOME", "USER", "LANG", "TERM", "SSH_AUTH_SOCK", "XDG_RUNTIME_DIR", "DBUS_SESSION_BUS_ADDRESS", "XDG_CONFIG_HOME", "XDG_DATA_HOME", "XDG_STATE_HOME"]
unset = ["PYTHONPATH", "PYTHONHOME", "VIRTUAL_ENV", "_PYTHON_SYSCONFIGDATA_NAME", "_PYTHON_HOST_PLATFORM", "PYTHONPYCACHEPREFIX"]

[workspace]
provider = "git-worktree"
root = "/realm/worktrees"
default_base = "origin/master"
identity_check = ["git", "diff", "--quiet", "--", "Cargo.toml", "Cargo.lock", "flake.nix", "flake.lock"]
checkpoint_untracked = true
verification_operations = ["check_default"]

[conflicts]
exact_files = ["Cargo.toml", "Cargo.lock", "flake.nix", "flake.lock"]
generated_surfaces = [".config/ast-grep/README.md", "xtask/docs/command-guide.md", "xtask/docs/command-reference.md", "schemas/v1/registry.json", "schemas/v2/registry.json"]

[conflicts.semantic_slots]
schema-contract = ["crate/sinex-schema/src/**/*.rs", "schemas/**/*.json"]
runtime-pipeline = ["crate/sinexd/src/event_engine/**/*.rs", "crate/sinexd/src/automata/registry.rs", "crate/sinexd/src/sources/**/*.rs"]
xtask-command-surface = ["xtask/src/lib.rs", "xtask/src/commands/**/*.rs", "CLAUDE.md", "TESTING.md"]

[operations.check_default]
description = "Run Sinex's default foreground verification command"
exec = ["xtask", "check"]
pool = "normal"
result = "exit"
cache = "tree+environment"

[operations.check_default.parameters.all]
type = "bool"
flag = "--all"

[operations.check_default.parameters.by_file]
type = "bool"
flag = "--by-file"

[operations.check_default.parameters.changed_strict_default]
type = "bool"
flag = "--agentctl-changed-strict-default"

[operations.check_default.parameters.fmt]
type = "bool"
flag = "--fmt"

[operations.check_default.parameters.forbidden]
type = "bool"
flag = "--forbidden"

[operations.check_default.parameters.full]
type = "bool"
flag = "--full"

[operations.check_default.parameters.heavy]
type = "bool"
flag = "--heavy"

[operations.check_default.parameters.lint]
type = "bool"
flag = "--lint"

[operations.check_default.parameters.lint_breakdown]
type = "bool"
flag = "--lint-breakdown"

[operations.check_default.parameters.nix]
type = "bool"
flag = "--nix"

[operations.check_default.parameters.package]
type = "string-list"
flag = "--package"
max_items = 32
max_length = 128

[operations.check_default.parameters.plan]
type = "bool"
flag = "--plan"

[operations.check_default.parameters.skip_tests]
type = "bool"
flag = "--skip-tests"
