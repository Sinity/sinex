schema = 1

[project]
id = "sinex"
display_name = "Sinex"
root_markers = ["Cargo.toml", "flake.nix", "xtask"]

[environment]
kind = "nix-develop"
command = ["nix", "develop", "--accept-flake-config", "--command"]
inherit = ["HOME", "USER", "LANG", "TERM", "SSH_AUTH_SOCK", "XDG_RUNTIME_DIR", "DBUS_SESSION_BUS_ADDRESS", "XDG_CONFIG_HOME", "XDG_DATA_HOME", "XDG_STATE_HOME", "SINEX_SOURCE_BINDINGS_PATH", "SINEX_DEV_POSTGRES_PORT", "SINEX_DEV_NATS_PORT"]
unset = ["PYTHONPATH", "PYTHONHOME", "VIRTUAL_ENV", "_PYTHON_SYSCONFIGDATA_NAME", "_PYTHON_HOST_PLATFORM", "PYTHONPYCACHEPREFIX"]

[workspace]
provider = "git-worktree"
root = "/realm/worktrees"
default_base = "origin/master"
identity_check = ["git", "diff", "--quiet", "--", "Cargo.toml", "Cargo.lock", "flake.nix", "flake.lock"]
checkpoint_untracked = true
verification_operations = ["check_default"]

[operations.dev_services]
description = "Run or share lease-owned Sinex development Postgres and NATS"
exec = ["nix", "run", ".#xtask", "--", "infra", "lease-services"]
pool = "normal"
result = "exit"
cache = "tree+environment"
timeout_seconds = 28800

[operations.dev_services.service]
readiness = "project-command"
lifetime = "job"

[operations.dev_services.service.ports.postgres]
environment = "SINEX_DEV_POSTGRES_PORT"
range = [45432, 45559]

[operations.dev_services.service.ports.nats]
environment = "SINEX_DEV_NATS_PORT"
range = [44308, 44435]

[conflicts]
exact_files = ["Cargo.toml", "Cargo.lock", "flake.nix", "flake.lock"]
generated_surfaces = [".config/ast-grep/README.md", "xtask/docs/command-guide.md", "xtask/docs/command-reference.md", "schemas/v1/registry.json", "schemas/v2/registry.json"]

[conflicts.semantic_slots]
schema-contract = ["crate/sinex-schema/src/**/*.rs", "schemas/**/*.json"]
runtime-pipeline = ["crate/sinexd/src/event_engine/**/*.rs", "crate/sinexd/src/automata/registry.rs", "crate/sinexd/src/sources/**/*.rs"]
xtask-command-surface = ["xtask/src/lib.rs", "xtask/src/commands/**/*.rs", "CLAUDE.md", "TESTING.md"]

[operations.check_default]
description = "Run Sinex's default foreground verification command"
exec = ["xtask", "check"]
pool = "normal"
result = "exit"
cache = "tree+environment"

[operations.check_default.parameters.all]
type = "bool"
flag = "--all"

[operations.check_default.parameters.by_file]
type = "bool"
flag = "--by-file"

[operations.check_default.parameters.changed_strict_default]
type = "bool"
flag = "--agentctl-changed-strict-default"

[operations.check_default.parameters.fmt]
type = "bool"
flag = "--fmt"

[operations.check_default.parameters.forbidden]
type = "bool"
flag = "--forbidden"

[operations.check_default.parameters.full]
type = "bool"
flag = "--full"

[operations.check_default.parameters.heavy]
type = "bool"
flag = "--heavy"

[operations.check_default.parameters.lint]
type = "bool"
flag = "--lint"

[operations.check_default.parameters.lint_breakdown]
type = "bool"
flag = "--lint-breakdown"

[operations.check_default.parameters.nix]
type = "bool"
flag = "--nix"

[operations.check_default.parameters.package]
type = "string-list"
flag = "--package"
max_items = 32
max_length = 128

[operations.check_default.parameters.plan]
type = "bool"
flag = "--plan"

[operations.check_default.parameters.skip_tests]
type = "bool"
flag = "--skip-tests"

[operations.build_default]
description = "Build Sinex packages through the foreground semantic build route"
exec = ["xtask", "build"]
pool = "normal"
result = "exit"
cache = "tree+environment"

[operations.build_default.parameters.all]
type = "bool"
flag = "--all"

[operations.build_default.parameters.dry_run]
type = "bool"
flag = "--dry-run"

[operations.build_default.parameters.package]
type = "string-list"
flag = "--package"
max_items = 32
max_length = 128

[operations.build_default.parameters.release]
type = "bool"
flag = "--release"

[operations.fix_default]
description = "Apply Sinex fixes through the foreground semantic fix workflow"
exec = ["xtask", "fix"]
pool = "normal"
result = "exit"
cache = "tree+environment"

[operations.fix_default.parameters.all]
type = "bool"
flag = "--all"

[operations.fix_default.parameters.clippy]
type = "bool"
flag = "--clippy"

[operations.fix_default.parameters.fmt_only]
type = "bool"
flag = "--fmt-only"

[operations.fix_default.parameters.package]
type = "string-list"
flag = "--package"
max_items = 32
max_length = 128

[operations.fix_default.parameters.smart]
type = "bool"
flag = "--smart"

[operations.fix_default.parameters.thorough]
type = "bool"
flag = "--thorough"

[operations.run_core]
description = "Run the default local Sinex core bundle through AgentCTL"
exec = ["xtask", "run", "core"]
pool = "normal"
result = "exit"
cache = "none"
timeout_seconds = 28800

[operations.run_core.parameters.release]
type = "bool"
flag = "--release"

[operations.run_core.parameters.instance_id]
type = "string"
flag = "--instance-id"
max_length = 128
grammar = "safe-token"

[operations.run_all_automatons]
description = "Run the default local Sinex automaton supervisor through AgentCTL"
exec = ["xtask", "run", "all-automatons"]
pool = "normal"
result = "exit"
cache = "none"
timeout_seconds = 28800

[operations.run_all_automatons.parameters.release]
type = "bool"
flag = "--release"

[operations.run_all_automatons.parameters.instance_id]
type = "string"
flag = "--instance-id"
max_length = 128
grammar = "safe-token"

[operations.run_all_sources]
description = "Run Sinex's manifest-driven source bindings through AgentCTL"
exec = ["xtask", "run", "all-sources"]
pool = "normal"
result = "exit"
cache = "none"
timeout_seconds = 28800

[operations.run_all_sources.parameters.release]
type = "bool"
flag = "--release"

[operations.run_all_sources.parameters.instance_id]
type = "string"
flag = "--instance-id"
max_length = 128
grammar = "safe-token"

[operations.run_all_sources.parameters.reconcile]
type = "bool"
flag = "--reconcile"

[operations.run_all_sources.parameters.service_name]
type = "string"
flag = "--service-name"
max_length = 128
grammar = "safe-token"

[operations.run_all_sources.parameters.include_default_excluded]
type = "bool"
flag = "--include-default-excluded"

[operations.vm_smoke]
description = "Run Sinex's default foreground NixOS VM smoke suite through AgentCTL"
exec = ["xtask", "test", "vm"]
pool = "normal"
result = "exit"
cache = "tree+environment"

[operations.vm_validate]
description = "Validate Sinex's foreground VM scenario surface through AgentCTL"
exec = ["xtask", "test", "vm", "--validate"]
pool = "normal"
result = "exit"
cache = "tree+environment"

[operations.test_default]
description = "Run Sinex's foreground nextest workflow through its semantic test planner"
exec = ["xtask", "test"]
pool = "normal"
result = "exit"
cache = "tree+environment"

[operations.test_default.parameters.all]
type = "bool"
flag = "--all"

[operations.test_default.parameters.debug]
type = "bool"
flag = "--debug"

[operations.test_default.parameters.dry_run]
type = "bool"
flag = "--dry-run"

[operations.test_default.parameters.exclude]
type = "string-list"
flag = "--exclude"
max_items = 32
max_length = 128

[operations.test_default.parameters.fail_fast]
type = "bool"
flag = "--fail-fast"

[operations.test_default.parameters.features]
type = "string-list"
flag = "--features"
max_items = 32
max_length = 128

[operations.test_default.parameters.heavy]
type = "bool"
flag = "--heavy"

[operations.test_default.parameters.include_ignored]
type = "bool"
flag = "--include-ignored"

[operations.test_default.parameters.lib]
type = "bool"
flag = "--lib"

[operations.test_default.parameters.list]
type = "bool"
flag = "--list"

[operations.test_default.parameters.no_reuse]
type = "bool"
flag = "--no-reuse"

[operations.test_default.parameters.package]
type = "string-list"
flag = "--package"
max_items = 32
max_length = 128

[operations.test_default.parameters.prime]
type = "bool"
flag = "--prime"

[operations.test_default.parameters.skip_preflight]
type = "bool"
flag = "--skip-preflight"

[operations.test_default.parameters.test]
type = "string-list"
flag = "--test"
max_items = 32
max_length = 128

[operations.test_default.parameters.update_snapshots]
type = "bool"
flag = "--update-snapshots"

[operations.verify_plan]
description = "Validate Sinex's phase verification manifest"
exec = ["xtask", "verify", "plan", "--check"]
pool = "normal"
result = "exit"
cache = "tree+environment"
timeout_seconds = 1800

[operations.verify_closure]
description = "Verify one closed Sinex Bead's acceptance criteria and evidence"
exec = ["xtask", "verify", "closure"]
pool = "normal"
result = "exit"
cache = "none"
timeout_seconds = 1800

[operations.verify_closure.parameters.bead_id]
type = "string"
position = 1
required = true
max_length = 128
grammar = "safe-token"

[operations.verify_closure.parameters.json]
type = "bool"
flag = "--json"

[operations.verify_closure.parameters.dry_run]
type = "bool"
flag = "--dry-run"
