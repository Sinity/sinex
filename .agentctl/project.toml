schema = 1
[project]
id = "sinex"
display_name = "Sinex isolated foundation"
root_markers = ["Cargo.toml", "flake.nix", "xtask"]
[environment]
kind = "nix-develop"
command = ["nix", "develop", "--command"]
inherit = ["HOME", "USER", "LANG", "PATH", "XDG_RUNTIME_DIR"]
unset = ["DATABASE_URL", "PGHOST", "PGPORT", "PGDATABASE", "PGUSER", "SQLX_OFFLINE"]
[operations.foundation_build]
description = "Build query-free schema/admin foundation"
exec = ["cargo", "build", "-p", "sinexd", "--no-default-features"]
pool = "bulk"
result = "exit"
timeout_seconds = 1800
cache = "none"
[operations.foundation_acceptance]
description = "Cold bootstrap and real-client foundation acceptance in owned isolated PostgreSQL"
exec = ["python3", "tests/foundation.py"]
pool = "bulk"
result = "exit"
timeout_seconds = 2400
cache = "none"
[operations.foundation_package]
description = "Build fresh source packages with query-free schema bootstrap inside the Nix builder"
exec = ["nix", "build", "--no-link", ".#default", "--print-build-logs", "--max-jobs", "1"]
pool = "bulk"
result = "exit"
timeout_seconds = 2400
cache = "none"

[operations.foundation_format]
description = "Format the foundation workspace before candidate qualification"
exec = ["cargo", "fmt", "--package", "sinex-model", "--package", "sinex-protocol", "--package", "sinex-store", "--package", "sinexd", "--package", "sinexctl", "--package", "xtask"]
pool = "normal"
result = "exit"
timeout_seconds = 300
cache = "none"

[operations.foundation_lock]
description = "Update explicitly selected foundation dependency lock entries"
exec = ["cargo", "update"]
arguments = "required"
pool = "normal"
result = "exit"
timeout_seconds = 300
cache = "none"

[operations.foundation_contracts]
description = "Run pure concrete model and wire boundary tests without a database"
exec = ["cargo", "test", "--locked", "-p", "sinex-model", "-p", "sinex-protocol"]
pool = "bulk"
result = "exit"
timeout_seconds = 900
cache = "none"

[operations.foundation_package_acceptance]
description = "Exercise actual Nix-packaged daemon and CLI against owned isolated PostgreSQL"
exec = ["python3", "tests/foundation.py", "--packaged"]
pool = "bulk"
result = "exit"
timeout_seconds = 2400
cache = "none"

[operations.atuin_acceptance]
description = "Retained synthetic Atuin through the owned writer and actual daemon/client"
exec = ["python3", "tests/foundation.py", "--atuin"]
pool = "bulk"
result = "exit"
timeout_seconds = 2400
cache = "none"

[operations.atuin_package_acceptance]
description = "Retained synthetic Atuin through Nix-packaged daemon and CLI"
exec = ["python3", "tests/foundation.py", "--atuin", "--packaged"]
pool = "bulk"
result = "exit"
timeout_seconds = 3600
cache = "none"

[operations.kestrel_demo]
description = "Packaged actual Kestrel paths plus launch and captured-answer reporting controls; requires a specification Git repository argument"
exec = ["python3", "tests/demo.py", "--controls"]
arguments = "required"
pool = "bulk"
result = "exit"
timeout_seconds = 3600
cache = "none"

