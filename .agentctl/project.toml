schema = 1
[project]
id = "sinex"
display_name = "Sinex"
root_markers = ["Cargo.toml", "flake.nix", "xtask"]
[environment]
kind = "nix-develop"
command = ["nix", "develop", "--command"]
inherit = ["HOME", "USER", "LANG", "PATH", "TMPDIR", "XDG_RUNTIME_DIR"]
unset = ["DATABASE_URL", "PGHOST", "PGPORT", "PGDATABASE", "PGUSER", "SQLX_OFFLINE"]
[operations.check]
description = "Format check, dependency boundaries and cargo check; no database"
exec = ["cargo", "run", "--locked", "--quiet", "-p", "xtask", "--", "check"]
pool = "normal"
result = "exit"
timeout_seconds = 1800
cache = "none"

[operations.test]
description = "All Rust tests; database tests each get a fresh database in an owned PostgreSQL"
exec = ["cargo", "run", "--locked", "--quiet", "-p", "xtask", "--", "test"]
pool = "bulk"
result = "exit"
timeout_seconds = 3600
cache = "none"

[operations.scenario]
description = "End-to-end scenarios (tests/scenarios/) through the real daemon, CLI and MCP; pass names or all, and --package DIR to test a built package"
exec = ["cargo", "run", "--locked", "--quiet", "-p", "xtask", "--", "scenario"]
arguments = "required"
pool = "bulk"
result = "exit"
timeout_seconds = 3600
cache = "none"

[operations.package]
description = "Build the Nix package (runs the Rust tests inside the builder)"
exec = ["nix", "build", "--no-link", ".#default", "--print-build-logs", "--max-jobs", "1"]
pool = "bulk"
result = "exit"
timeout_seconds = 2400
cache = "none"

[operations.fmt]
description = "Format the workspace"
exec = ["cargo", "fmt", "--all"]
pool = "normal"
result = "exit"
timeout_seconds = 300
cache = "none"

[operations.lock]
description = "Update selected Cargo.lock entries, e.g. -- -p serde"
exec = ["cargo", "update"]
arguments = "required"
pool = "normal"
result = "exit"
timeout_seconds = 300
cache = "none"

[operations.exec]
description = "Run a command in the development shell"
exec = ["env"]
arguments = "required"
pool = "bulk"
result = "exit"
timeout_seconds = 1800
scratch = "nvme"
cache = "none"

[operations.foundation_acceptance]
description = "Cold bootstrap and real-client foundation acceptance in owned isolated PostgreSQL"
exec = ["python3", "tests/foundation.py"]
pool = "bulk"
result = "exit"
timeout_seconds = 2400
cache = "none"

[operations.foundation_package_acceptance]
description = "Exercise actual Nix-packaged daemon and CLI against owned isolated PostgreSQL"
exec = ["python3", "tests/foundation.py", "--packaged"]
pool = "bulk"
result = "exit"
timeout_seconds = 2400
cache = "none"

