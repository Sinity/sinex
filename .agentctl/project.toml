schema = 1
[project]
id = "sinex"
display_name = "Sinex"
root_markers = ["Cargo.toml", "flake.nix", "xtask"]
[environment]
kind = "nix-develop"
command = ["nix", "develop", "--command"]
inherit = ["HOME", "USER", "LANG", "PATH", "TMPDIR", "XDG_RUNTIME_DIR", "CARGO_TARGET_DIR"]
unset = ["DATABASE_URL", "PGHOST", "PGPORT", "PGDATABASE", "PGUSER", "SQLX_OFFLINE"]
[environment.values]
# Each build uses two compiler workers.
CARGO_BUILD_JOBS = "2"
# Incremental state is half of each target directory and the drive is write-bound;
# agent builds rarely reuse it across commits.
CARGO_INCREMENTAL = "0"

[operations.check]
description = "Format check, dependency boundaries and clippy against the schema database"
exec = ["cargo", "run", "--locked", "--quiet", "-p", "xtask", "--", "check"]
pool = "compile"
result = "exit"
timeout_seconds = 1800
scratch = "nvme"
cache = "none"
unit_properties = ["MemoryHigh=8G"]

[operations.test]
description = "All Rust tests under nextest; each database test clones the schema template"
exec = ["cargo", "run", "--locked", "--quiet", "-p", "xtask", "--", "test"]
pool = "bulk"
result = "exit"
# A contended initial build can take an hour; the complete test phase takes
# about ten minutes. Individual nextest deadlines remain unchanged.
timeout_seconds = 4500
scratch = "tmpfs"
cache = "none"
unit_properties = ["MemoryHigh=8G"]

[operations.catalog]
description = "Regenerate nix/catalog.json from the source declarations (sinexd admin catalog, compiled against the schema database)"
exec = ["cargo", "run", "--locked", "--quiet", "-p", "xtask", "--", "db", "exec", "--", "bash", "-c", "cargo run --locked --quiet -p sinexd -- admin catalog > nix/catalog.json.new && mv nix/catalog.json.new nix/catalog.json"]
pool = "compile"
result = "exit"
timeout_seconds = 1800
scratch = "nvme"
cache = "none"
unit_properties = ["MemoryHigh=8G"]

[operations.focused]
description = "Selected package/tests under nextest; pass -p PACKAGE and filters; full suites use bulk test"
exec = ["cargo", "run", "--locked", "--quiet", "-p", "xtask", "--", "test"]
arguments = "required"
pool = "normal"
result = "exit"
# The outer budget includes compilation; individual test deadlines are unchanged.
timeout_seconds = 3600
scratch = "tmpfs"
cache = "none"
unit_properties = ["MemoryHigh=8G"]

[operations.private_history]
description = "Copied Atuin acceptance: interrupted admission, public queries and unchanged reread"
exec = ["bash", ".agentctl/private-history.sh"]
arguments = "required"
pool = "normal"
result = "exit"
timeout_seconds = 900
scratch = "tmpfs"
cache = "none"
unit_properties = ["MemoryHigh=8G"]

[operations.package]
description = "Build the Nix package (runs the tests that need no database inside the builder)"
exec = ["nix", "build", "--no-link", ".#default", "--print-build-logs", "--max-jobs", "1"]
pool = "bulk"
result = "exit"
timeout_seconds = 2400
scratch = "nvme"
cache = "none"

[operations.fmt]
description = "Format the workspace"
exec = ["cargo", "fmt", "--all"]
pool = "interactive"
result = "exit"
timeout_seconds = 300
scratch = "nvme"
cache = "none"

[operations.lock]
description = "Update selected Cargo.lock entries, e.g. -- -p serde"
exec = ["cargo", "update"]
arguments = "required"
pool = "interactive"
result = "exit"
timeout_seconds = 300
scratch = "nvme"
cache = "none"

[operations.exec]
description = "Run a command in the development shell"
exec = ["env"]
arguments = "required"
pool = "bulk"
result = "exit"
timeout_seconds = 1800
scratch = "nvme"
cache = "none"
unit_properties = ["MemoryHigh=8G"]

[operations.bench]
description = "Run the corpus benchmark through the shared job queue"
exec = ["cargo", "run", "--locked", "--quiet", "--target-dir", "target/bench", "-p", "xtask", "--", "bench"]
arguments = "required"
pool = "measure"
result = "exit"
timeout_seconds = 14400
scratch = "nvme"
cache = "none"

[operations.measure_run]
description = "Run a measurement that compiles nothing (a database restore, a benchmark of prebuilt binaries) in the measure queue"
exec = ["env"]
arguments = "required"
pool = "measure"
result = "exit"
timeout_seconds = 7200
scratch = "nvme"
cache = "none"

[operations.compile]
description = "Selected package or target compilation against the schema database"
exec = ["cargo", "run", "--locked", "--quiet", "-p", "xtask", "--", "compile"]
arguments = "required"
pool = "compile"
result = "exit"
timeout_seconds = 1800
scratch = "nvme"
cache = "none"
unit_properties = ["MemoryHigh=8G"]

[operations.codex]
description = "Run one Codex worker in this checkout: codex-worker <effort> <prompt-file> <output-schema> <output-dir> [model]"
exec = ["codex-worker"]
arguments = "required"
pool = "codex"
result = "exit"
timeout_seconds = 28800
cache = "none"

[operations.vm]
description = "Run xtask vm with explicit arguments and recorded results"
exec = ["cargo", "run", "--locked", "--quiet", "-p", "xtask", "--", "vm"]
arguments = "required"
pool = "bulk"
result = "exit"
timeout_seconds = 7200
scratch = "nvme"
cache = "none"
unit_properties = ["MemoryHigh=8G"]

[operations.development]
description = "Run xtask run with explicit arguments and recorded results"
exec = ["cargo", "run", "--locked", "--quiet", "-p", "xtask", "--", "run"]
arguments = "required"
pool = "normal"
result = "exit"
timeout_seconds = 28800
scratch = "nvme"
cache = "none"
unit_properties = ["MemoryHigh=8G"]

[operations.coverage]
description = "Run xtask coverage with explicit arguments and recorded results"
exec = ["cargo", "run", "--locked", "--quiet", "-p", "xtask", "--", "coverage"]
arguments = "required"
pool = "bulk"
result = "exit"
timeout_seconds = 3600
scratch = "nvme"
cache = "none"
unit_properties = ["MemoryHigh=8G"]
