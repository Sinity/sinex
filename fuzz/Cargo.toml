[package]
name = "sinex-fuzz"
version.workspace = true
edition.workspace = true
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
# libFuzzer itself (a C++ build) is linked only when fuzzing:
# `cargo fuzz run <target> --features libfuzzer`. Workspace checks compile
# the harnesses without it.
libfuzzer-sys = { version = "0.4", default-features = false }
serde_json.workspace = true
jiff.workspace = true
sinex-store.workspace = true
sqlx.workspace = true
tokio.workspace = true
sinex-model.workspace = true
sinex-protocol.workspace = true

[features]
libfuzzer = ["libfuzzer-sys/link_libfuzzer"]

[[bin]]
name = "manifest_roundtrip"
path = "fuzz_targets/manifest_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "producer_roundtrip"
path = "fuzz_targets/producer_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "query"
path = "fuzz_targets/query.rs"
test = false
doc = false
bench = false

[[bin]]
name = "copy_escape"
path = "fuzz_targets/copy_escape.rs"
test = false
doc = false
bench = false

[dev-dependencies]
devkit.workspace = true
